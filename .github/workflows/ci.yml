name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint + types + hermetic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        # --ignore-scripts: npm lifecycle scripts (postinstall/preinstall) execute
        # attacker-controlled code from package.json. The 2026-11-11 incident ran
        # a 1493-line exfil collector via a "postinstall" hook. This repo's only
        # legitimate lifecycle script is "prepare" (git hooks path), which the
        # Pre-Push gate re-establishes locally — CI does not need it.
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Zero-LLM tests
        run: npm run test:zero-llm
